qservImageName: ""
mariadbImageName: ""
sslProxyImageName: ""
ingestHelperImageName: ""

qservImagePullPolicy: IfNotPresent
mariadbImagePullPolicy: IfNotPresent
sslProxyImagePullPolicy: IfNotPresent
ingestHelperPullPolicy: IfNotPresent

mode: full  # full | db-only
podManagementPolicy: Parallel  # Parallel | OrderedReady

czars:
  replicas: 1
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 5Ti

workers:
  replicas: 5
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 10Ti

replication:
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 2Ti

ingest:
  enable: false
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 200Gi

czarExternalService:
  enable: false
