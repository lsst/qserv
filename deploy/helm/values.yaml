qservImageName: ""
mariadbImageName: ""
sslProxyImageName: ""
ingestHelperImageName: ""

qservImagePullPolicy: IfNotPresent
mariadbImagePullPolicy: IfNotPresent
sslProxyImagePullPolicy: IfNotPresent
ingestHelperPullPolicy: IfNotPresent

# full            - the whole system
# db-only         - MariaDB only, all Qserv sidecars gated off (maintenance)
# mariadb-upgrade - MariaDB only, running mariadb-upgrade in place on each data volume;
#                   see "MariaDB major-version upgrades" in doc/architecture/deployment.md
mode: full  # full | db-only | mariadb-upgrade
podManagementPolicy: Parallel  # Parallel | OrderedReady

czars:
  replicas: 1
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 5Ti

workers:
  replicas: 5
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 10Ti

replication:
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 2Ti

ingest:
  enable: false
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 200Gi

czarExternalService:
  enable: false

certManager:
  enabled: false
  # If empty, the chart creates a namespace-scoped self-signed Issuer
  issuerRef: {}
  dnsNames: []
