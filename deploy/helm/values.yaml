qservImageName: ""
mariadbImageName: ""
sslProxyImageName: ""
ingestHelperImageName: ""

qservImagePullPolicy: IfNotPresent
mariadbImagePullPolicy: IfNotPresent
sslProxyImagePullPolicy: IfNotPresent
ingestHelperPullPolicy: IfNotPresent

# full            - the whole system
# db-only         - MariaDB server containers only (maintenance)
# mariadb-upgrade - MariaDB server containers only, running mariadb-upgrade in place on each data volume
mode: full

mariadbUpgrade:
  # Re-run the upgrade on volumes whose completion marker already records a result for the running server
  # version. Only consulted in "mariadb-upgrade" mode. Markers from an earlier server version never need
  # this -- they are ignored automatically. Use it to retry after investigating a recorded failure.
  force: false

podManagementPolicy: Parallel  # Parallel | OrderedReady

czars:
  replicas: 1
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 5Ti

workers:
  replicas: 5
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 10Ti

replication:
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 2Ti

ingest:
  enable: false
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 200Gi

czarExternalService:
  enable: false

certManager:
  enabled: false
  # If empty, the chart creates a namespace-scoped self-signed Issuer
  issuerRef: {}
  dnsNames: []
