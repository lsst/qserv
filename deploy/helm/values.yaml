qservImageName: ghcr.io/lsst/qserv:2026.7.1-rc1-73-gd470889e8
mariadbImageName: ghcr.io/lsst/qserv-mariadb:2026.7.1-rc1
sslProxyImageName: qserv/mysql-proxy-ssl:latest
ingestHelperImageName: ghcr.io/lsst/qserv-build-base:2026.7.1-rc1-1-ga7a3dbc68

qservImagePullPolicy: IfNotPresent
mariadbImagePullPolicy: IfNotPresent
sslProxyImagePullPolicy: IfNotPresent
ingestHelperPullPolicy: IfNotPresent

mode: full  # full | db-only
podManagementPolicy: Parallel  # Parallel | OrderedReady

czars:
  replicas: 1
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 5Ti

workers:
  replicas: 5
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 10Ti

replication:
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 2Ti

ingest:
  enable: false
  # tier: []
  storage:
    class: rubin-qserv-storage
    size: 200Gi

czarExternalService:
  enable: false
